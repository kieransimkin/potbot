[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "potbot"
version = "0.5.0.dev1"
description = "Foundation for an evidence-driven, multi-model coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
embeddings = ["transformers==4.57.6", "torch==2.9.1"]
semantics = ["jsonschema>=4.26,<5"]
credentials = ["keyring==25.7.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
potbot = "potbot.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.26,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/potbot"]

[tool.hatch.build.targets.wheel.force-include]
"vocab" = "potbot/semantics/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib -ra"
markers = [
  "postgres: requires an explicitly configured real PostgreSQL test database",
  "sandbox: requires a functional Linux bubblewrap and libseccomp isolation boundary",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/potbot"]
strict = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true
