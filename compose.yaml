# Disposable fixture only. The versioned upstream tag is documented at:
# https://github.com/pgvector/pgvector#docker
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_USER: potbot_test
      POSTGRES_PASSWORD: potbot_test_only
      POSTGRES_DB: potbot_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potbot_test -d potbot_test"]
      interval: 2s
      timeout: 3s
      retries: 30
