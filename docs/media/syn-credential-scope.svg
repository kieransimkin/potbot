<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">Syn credentials stay inside one configured scope</title>
<desc id="desc">The authenticated workspace, installation ID and service-origin identity must match before Potbot resolves a native-vault or injected token and makes a Syn request. Mismatches stop before network access. Capture filters protect supported secret encodings.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#285db3"/></marker></defs>
<rect width="1280" height="590" rx="20" fill="#eff5ff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#142b49">
<text x="45" y="52" font-size="29" font-weight="700">One credential, one configured destination</text>
<text x="45" y="83" font-size="17">Explanatory illustration of implemented local checks · no token values shown</text>
<g fill="#fff" stroke="#a6bad5" stroke-width="2">
<rect x="45" y="130" width="330" height="205" rx="14"/>
<rect x="465" y="130" width="350" height="205" rx="14"/>
<rect x="905" y="130" width="330" height="205" rx="14"/>
</g>
<g font-size="23" font-weight="700"><text x="68" y="171">Trusted local configuration</text><text x="490" y="171">Scoped credential broker</text><text x="929" y="171">Workspace-bound client</text></g>
<g font-size="18">
<text x="68" y="213">Stable installation UUID</text><text x="68" y="246">Authenticated workspace UUID</text><text x="68" y="279">Canonical Syn service origin</text>
<text x="490" y="213">Exact installation + workspace</text><text x="490" y="246">Origin digest + vault profile</text><text x="490" y="279">Native vault or explicit injection</text>
<text x="929" y="213">Check workspace on every call</text><text x="929" y="246">Use shared Syn HTTP protocol</text><text x="929" y="279">Verify returned receipts</text>
</g>
<g stroke="#285db3" stroke-width="3" marker-end="url(#arrow)"><path d="M388 235H449"/><path d="M830 235H891"/></g>
<rect x="100" y="386" width="480" height="100" rx="12" fill="#fcebe9" stroke="#be6b60"/>
<text x="125" y="423" font-size="21" font-weight="700">Scope mismatch: stop locally</text><text x="125" y="456" font-size="18">No token read for another scope; no network call</text>
<rect x="675" y="386" width="505" height="100" rx="12" fill="#e5f3ee" stroke="#6b9c88"/>
<text x="700" y="423" font-size="21" font-weight="700">Known-secret capture filters</text><text x="700" y="456" font-size="18">Literal, URL-encoded and base64 forms are redacted</text>
<text x="45" y="545" font-size="17">Syn still grants workspace-wide access. Local scope checks do not create channel ACLs or signed authorship.</text>
</g></svg>
