<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-labelledby="t d">
<title id="t">Planned transaction lifecycle with separate finality and effect verification</title>
<desc id="d">Nine stages: Potbot commits an intent, local Syn stores signed bytes, the private Syn group replicates, the ordering engine and reducer finalise an outcome, a client verifies proof, Potbot admits it, the effect owner attempts work, independent readback verifies it, then a new Syn transaction settles the reservation. Delivery retries reuse exact IDs.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#45677d"/></marker></defs>
<rect width="1180" height="820" rx="18" fill="#f4f7fa"/>
<g font-family="Arial, sans-serif" fill="#18374a">
<text x="40" y="44" font-size="25" font-weight="bold">From local intent to a verified external outcome</text>
<text x="40" y="76" font-size="17">Planned sequence · each boundary has its own durable identity and evidence</text>
<g fill="#e7eff8" stroke="#6e8496"><rect x="45" y="115" width="330" height="145" rx="12"/><rect x="425" y="115" width="330" height="145" rx="12"/><rect x="805" y="115" width="330" height="145" rx="12"/></g>
<text x="65" y="150" font-size="20" font-weight="bold">1  Commit Potbot intent</text><text x="65" y="184" font-size="17">Event + approved bytes + outbox</text><text x="65" y="212" font-size="17">One local SQL transaction</text><text x="65" y="239" font-size="16">No network wait inside the commit</text>
<text x="445" y="150" font-size="20" font-weight="bold">2  Store in the local Syn</text><text x="445" y="184" font-size="17">Native account signature</text><text x="445" y="212" font-size="17">Durable exact record identity</text><text x="445" y="239" font-size="16">Local acknowledgement only</text>
<text x="825" y="150" font-size="20" font-weight="bold">3  Replicate through Syn</text><text x="825" y="184" font-size="17">Private encrypted pub-sub</text><text x="825" y="212" font-size="17">Durable peer receipt and repair</text><text x="825" y="239" font-size="16">Peer receipt is not finality</text>
<g fill="#edeafb" stroke="#7b70a5"><rect x="45" y="330" width="330" height="145" rx="12"/><rect x="425" y="330" width="330" height="145" rx="12"/><rect x="805" y="330" width="330" height="145" rx="12"/></g>
<text x="825" y="365" font-size="20" font-weight="bold">4  Finalise shared outcome</text><text x="825" y="399" font-size="17">Type-policy order + reducer</text><text x="825" y="427" font-size="17">Accept or reject against state</text><text x="825" y="454" font-size="16">Bind stream/epoch and outcome roots</text>
<text x="445" y="365" font-size="20" font-weight="bold">5  Verify the exact proof</text><text x="445" y="399" font-size="17">Type policy + node-hash roster</text><text x="445" y="427" font-size="17">Authenticate the outcome root</text><text x="445" y="454" font-size="16">Required profile evidence or replay</text>
<text x="65" y="365" font-size="20" font-weight="bold">6  Admit inside Potbot</text><text x="65" y="399" font-size="17">Inbox + cursor + local decision</text><text x="65" y="427" font-size="17">Check task, grant, budget, fence</text><text x="65" y="454" font-size="16">Deduplication precedes dispatch</text>
<g fill="#fff1df" stroke="#a47b35"><rect x="45" y="545" width="330" height="145" rx="12"/><rect x="425" y="545" width="330" height="145" rx="12"/></g><rect x="805" y="545" width="330" height="145" rx="12" fill="#e1f4eb" stroke="#4c876b"/>
<text x="65" y="580" font-size="20" font-weight="bold">7  Attempt the external work</text><text x="65" y="614" font-size="17">Persist effect-attempt identity</text><text x="65" y="642" font-size="17">Use provider idempotency/fences</text><text x="65" y="669" font-size="16">A timeout leaves the outcome unknown</text>
<text x="445" y="580" font-size="20" font-weight="bold">8  Reconcile and verify</text><text x="445" y="614" font-size="17">Read back the actual effect</text><text x="445" y="642" font-size="17">Retain independent evidence</text><text x="445" y="669" font-size="16">Delivery retry does not repeat work</text>
<text x="825" y="580" font-size="20" font-weight="bold">9  Report and settle via Syn</text><text x="825" y="614" font-size="17">New attributed result operation</text><text x="825" y="642" font-size="17">Consume/release reservation</text><text x="825" y="669" font-size="16">Keep the original causal identities</text>
<g stroke="#45677d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M377 186H420"/><path d="M757 186H800"/><path d="M970 264V324"/><path d="M803 402H760"/><path d="M423 402H380"/><path d="M210 479V539"/><path d="M377 617H420"/><path d="M757 617H800"/></g>
<text x="45" y="741" font-size="18" font-weight="bold">Unknown acknowledgement: query or retry the same exact signed transaction.</text>
<text x="45" y="775" font-size="17">A finality proof authenticates shared state. It does not establish that a tool completed or a claim is true.</text>
</g></svg>
