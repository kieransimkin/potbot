<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Existing-policy DAG finality and Type governance</title>
<desc id="desc">An independently pinned predecessor supplies old policy, context and node roster. Signed DAG ancestry is replayed through witnesses and fame to choose one proposal. Separate old Type-governance approval is required before append. Unresolved coins and missing evidence hold.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#92afca" stroke-width="2"/></marker></defs>
<rect width="1200" height="540" rx="18" fill="#101c2b"/>
<g font-family="Arial,sans-serif" fill="#eef6ff"><text x="32" y="43" font-size="25" font-weight="700">One replacement. Two existing authorities.</text><text x="32" y="70" font-size="15" fill="#b3c8db">Implemented bounded offline verification • generated illustration • no live federation claim</text>
<g stroke="#365774" stroke-width="2" fill="#1c3044"><rect x="32" y="110" width="260" height="130" rx="12"/><rect x="340" y="110" width="295" height="130" rx="12"/><rect x="685" y="110" width="295" height="130" rx="12"/><rect x="340" y="295" width="295" height="115" rx="12"/><rect x="685" y="295" width="295" height="115" rx="12"/><rect x="1020" y="200" width="150" height="115" rx="12"/></g>
<g font-size="18" font-weight="700"><text x="50" y="143">Pinned predecessor</text><text x="360" y="143">Old-policy DAG</text><text x="705" y="143">First authorized proposal</text><text x="360" y="329">Old Type governors</text><text x="705" y="329">Require both</text><text x="1036" y="236">Append v2</text></g>
<g font-size="15" fill="#c5d9e9"><text x="50" y="172">Policy + epoch + roster</text><text x="50" y="199">Node public-key hashes</text><text x="50" y="222">Workspace / domain / stream</text><text x="360" y="172">Authenticated ancestors + forks</text><text x="360" y="199">Rounds → witnesses → fame</text><text x="360" y="222">Received order + exact median</text><text x="705" y="172">Governance-certified payload</text><text x="705" y="199">Later competing proposal loses</text><text x="705" y="222">New roster cannot ratify itself</text><text x="360" y="359">Separate proposal authorization</text><text x="360" y="385">Fresh outer consent at import</text><text x="705" y="359">Every old policy + old governors</text><text x="705" y="385">Compare exact retained parent</text><text x="1036" y="264">Immutable</text><text x="1036" y="288">local history</text></g>
<g fill="none" stroke="#92afca" stroke-width="2" marker-end="url(#arrow)"><path d="M292 175 H329"/><path d="M635 175 H674"/><path d="M162 240 V351 H329"/><path d="M635 351 H674"/><path d="M832 240 V284"/><path d="M980 350 H995 V260 H1009"/></g>
<rect x="32" y="450" width="1138" height="60" rx="10" fill="#463426" stroke="#9d7852"/><text x="50" y="476" font-size="16" font-weight="700" fill="#ffe2b4">HOLD: incomplete ancestry • unresolved coin • wrong context • wrong old authority</text><text x="50" y="498" font-size="14" fill="#f2d1a6">4..16 equal voters / 256 events / 32 rounds. Custody independence, mesh, producer safety and engine qualification remain separate gates.</text>
</g></svg>
