<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Protected DAG signing with an independent operator anchor</title><desc id="desc">Prepare persists an encrypted recovery capsule without releasing the event signature. An operator anchor permanently reserves one event for each parent using a write-ahead record. Commit persists the Agent head before release. An old vault recovers the original event; another branch is refused.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#9ebbd0" stroke-width="2"/></marker></defs>
<rect width="1200" height="620" rx="18" fill="#101c2b"/><g font-family="Arial,sans-serif" fill="#eef6ff"><text x="30" y="42" font-size="25" font-weight="700">An old vault must not create a new branch.</text><text x="30" y="70" font-size="15" fill="#b6cbdc">Implemented custody boundary • generated illustration • operator state stays outside Agent restores</text>
<g fill="#1d3348" stroke="#476681" stroke-width="2"><rect x="30" y="110" width="330" height="170" rx="12"/><rect x="435" y="110" width="330" height="170" rx="12"/><rect x="840" y="110" width="330" height="170" rx="12"/><rect x="30" y="350" width="330" height="120" rx="12"/><rect x="435" y="350" width="330" height="120" rx="12"/><rect x="840" y="350" width="330" height="120" rx="12"/></g>
<g font-size="20" font-weight="700"><text x="50" y="145">1 · Native prepare</text><text x="455" y="145">2 · Operator reservation</text><text x="860" y="145">3 · Native commit</text><text x="50" y="385">Restored Agent vault</text><text x="455" y="385">Recover exact receipt</text><text x="860" y="385">Same public event</text></g>
<g font-size="16" fill="#c8dceb"><text x="50" y="178">Sign into an encrypted capsule</text><text x="50" y="207">Persist pending intent first</text><text x="50" y="236">Release only the signed intent</text><text x="455" y="178">One event per node / context / parent</text><text x="455" y="207">Vault WAL → journal → vault pin</text><text x="455" y="236">Flush before releasing the receipt</text><text x="860" y="178">Verify receipt + decrypt capsule</text><text x="860" y="207">Persist local head before output</text><text x="860" y="236">Generic signatures cannot bypass</text><text x="50" y="417">Old counter or lost pending state</text><text x="50" y="447">Different branch gets no receipt</text><text x="455" y="417">Replay authenticated stored capsule</text><text x="455" y="447">Resume in sequence; never reset</text><text x="860" y="417">Same body, signature and identity</text><text x="860" y="447">Then continue from reserved head</text></g>
<g fill="none" stroke="#9ebbd0" stroke-width="2" marker-end="url(#a)"><path d="M360 195 H424"/><path d="M765 195 H829"/><path d="M195 350 V306 H600 V291"/><path d="M360 413 H424"/><path d="M765 413 H829"/><path d="M1005 350 V291"/></g>
<rect x="30" y="520" width="1140" height="70" rx="10" fill="#463426" stroke="#a47c50"/><text x="50" y="548" font-size="16" font-weight="700" fill="#ffe0b2">HOLD: missing anchor • digest mismatch • wrong parent • sequence gap • unresolved intent • exhausted capacity</text><text x="50" y="574" font-size="14" fill="#efd0aa">A full rollback of both operator files needs an external checkpoint or governed identity retirement. No live mesh or automatic producer is enabled.</text></g></svg>
