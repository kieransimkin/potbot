<text x="40" y="90" font-size="18" fill="#bdc8d8">Proposed strategy · separate evidence states · no ownership preference</text>
<g fill="#202c42" stroke="#60728e" stroke-width="2"><rect x="40" y="140" width="230" height="145" rx="12"/><rect x="330" y="140" width="230" height="145" rx="12"/><rect x="620" y="140" width="230" height="145" rx="12"/><rect x="910" y="140" width="250" height="145" rx="12"/></g>
