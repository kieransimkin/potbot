<g font-size="17"><text x="60" y="220">Types and task language</text><text x="60" y="250">Pinned source metadata</text><text x="350" y="220">Filter denied routes</text><text x="350" y="250">Explain fit and unknowns</text><text x="640" y="220">Exact existing authority</text><text x="640" y="250">Version, hash and scopes</text><text x="930" y="220">Health and isolation</text><text x="930" y="250">Verified task outcome</text></g>
