<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">One operator and two separate Syn Agent sandboxes</title>
<desc id="desc">The operator holds derivation authority. Each Agent has a separate operating-system identity, native keystore, assigned leaf and current group key. Potbot handles verified packages and process lifetime.</desc>
<rect width="1100" height="550" rx="20" fill="#101b2d"/>
<g font-family="Arial, sans-serif" fill="#eef4ff">
<text x="45" y="55" font-size="27" font-weight="bold">One authority, separate running identities</text>
<text x="45" y="87" font-size="16" fill="#bbcadf">Conceptual boundary diagram · software custody · no hardware attestation</text>
<rect x="45" y="125" width="1010" height="72" rx="12" fill="#213955" stroke="#83a8d0"/>
<text x="70" y="155" font-size="21" font-weight="bold">Potbot: verify release · provision OS resources · own process lifetime</text>
<text x="70" y="181" font-size="16" fill="#ccdaed">Public receipts and encrypted enrollment frames</text>
<rect x="45" y="245" width="285" height="225" rx="14" fill="#243149" stroke="#f4bb6e" stroke-width="2"/>
<text x="66" y="280" font-size="23" font-weight="bold">Operator Syn</text>
<text x="66" y="315" font-size="17">Root and base authority</text>
<text x="66" y="346" font-size="17">Protected allocation journal</text>
<text x="66" y="377" font-size="17">Separate group derivation</text>
<text x="66" y="433" font-size="16" fill="#f4bb6e">Private owner approval</text>
<rect x="390" y="245" width="300" height="225" rx="14" fill="#1c3a42" stroke="#72d9c0" stroke-width="2"/>
<text x="414" y="280" font-size="23" font-weight="bold">Agent A sandbox</text>
<text x="414" y="315" font-size="17">Native host UID A</text>
<text x="414" y="346" font-size="17">Its own leaf and keystore</text>
<text x="414" y="377" font-size="17">Current group / epoch key</text>
<text x="414" y="433" font-size="16" fill="#72d9c0">Retained identity after restart</text>
<rect x="750" y="245" width="305" height="225" rx="14" fill="#28374f" stroke="#a2b9ff" stroke-width="2"/>
<text x="774" y="280" font-size="23" font-weight="bold">Agent B sandbox</text>
<text x="774" y="315" font-size="17">Native host UID B</text>
<text x="774" y="346" font-size="17">Its own leaf and keystore</text>
<text x="774" y="377" font-size="17">Current group / epoch key</text>
<text x="774" y="433" font-size="16" fill="#a2b9ff">Retained identity after restart</text>
<path d="M187 197v48M540 197v48M902 197v48" stroke="#92a9c5" stroke-width="3"/>
<text x="45" y="515" font-size="17" fill="#ccdaed">Account identity and group membership are distinct. Cog admission remains a separate gate.</text>
</g></svg>
