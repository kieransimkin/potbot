name: Xpra native per-window Dockview acceptance

on:
  push:
    paths:
      - 'src/potbot/tools/xpra_seamless.py'
      - 'src/potbot/tools/x11_workspace_server.py'
      - 'frontend/**'
      - 'tests/integration/test_xpra_*'
      - 'tests/acceptance/xpra_xbill_dock_smoke.py'
      - '.github/workflows/xpra-native-window-acceptance.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      run_xbill_browser:
        description: 'Run full sandboxed XBill/Next browser acceptance on preprovisioned Xpra 6.3+ self-hosted runner'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POTBOT_XPRA_HTML5_SOURCE: ${{ github.workspace }}/external/xpra-html5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get immutable upstream MPL-2.0 HTML5 client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Xpra-org/xpra-html5
          ref: 3752e59b7bb3120a5f20794ce754b3b76ac96c4b
          path: external/xpra-html5
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install Xauthority for isolated socket fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xauth
      - name: Install locked Python test environment
        run: uv sync --locked --extra web --dev
      - name: Prepare window-only client (fails on upstream source drift)
        run: >-
          uv run --locked python frontend/scripts/prepare-xpra-html5.py
          --upstream external/xpra-html5 --output frontend/public/xpra-html5
      - name: Test native relay contract and actual pinned upstream source hooks
        run: >-
          uv run --locked python -m pytest -q
          tests/integration/test_xpra_native_bridge.py
          tests/integration/test_xpra_vendor_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native frontend route/protocol tests
        working-directory: frontend
        run: npm test
      - name: Estimate synthetic partial-frame copy volume (not GPU FPS)
        working-directory: frontend
        run: npm run benchmark:xpra
      - name: CPU-only window inventory search benchmark
        working-directory: frontend
        run: npm run benchmark:windows
      - name: Install Next.js packages and check types
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Retain source pin and license evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpra-window-only-source-pin
          path: |
            frontend/public/xpra-html5/UPSTREAM-REVISION
            frontend/public/xpra-html5/LICENSE
          if-no-files-found: warn
          retention-days: 14

  sandboxed-xbill-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_xbill_browser }}
    runs-on: [self-hosted, linux, xpra]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Xpra-org/xpra-html5
          ref: 3752e59b7bb3120a5f20794ce754b3b76ac96c4b
          path: external/xpra-html5
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require real Xpra, XBill, xauth, bubblewrap, browser prerequisites
        run: |
          command -v xpra && command -v xbill && command -v xterm && command -v xauth && command -v bwrap
          xpra --version
          uv sync --locked --extra web --dev
          uv pip install --python .venv/bin/python 'playwright>=1.52,<2'
          .venv/bin/python -m playwright install chromium
      - name: Prepare upstream client
        run: >-
          uv run --locked python frontend/scripts/prepare-xpra-html5.py
          --upstream external/xpra-html5 --output frontend/public/xpra-html5
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Verify XBill and xterm appear independently, minimize/restore and accept input
        env:
          POTBOT_RUN_REAL_XPRA_XBILL: '1'
          POTBOT_XPRA_ACCEPTANCE_SCREENSHOT: ${{ github.workspace }}/artifacts/xpra-xbill-dock.png
        run: uv run --no-sync python tests/acceptance/xpra_xbill_dock_smoke.py
      - name: Retain real browser screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xpra-multiwindow-dockview-screenshot
          path: artifacts/xpra-xbill-dock.png
          if-no-files-found: warn
          retention-days: 14
