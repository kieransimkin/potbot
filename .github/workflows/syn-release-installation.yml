name: Syn release installation boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --dev --extra security
      - name: Check trust, redirects, cache, atomic admission and concurrent offline installation
        run: uv run --locked python -m pytest -q tests/unit/test_syn_release_installation.py --junitxml=artifacts/syn-release-boundaries.xml
      - name: Record the real portable operator interface
        run: uv run --locked python -m potbot syn-release --help > artifacts/syn-release-help.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syn-release-installation-boundaries
          path: artifacts/syn-release-*
          if-no-files-found: error
          retention-days: 14
