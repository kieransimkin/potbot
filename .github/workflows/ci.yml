name: Potbot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/potbot-identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Check native source formatting
        run: cargo fmt --check
      - name: Verify native cryptographic and vault contracts
        run: cargo test --locked --release --lib
      - name: Build protected native executable
        run: cargo build --locked --release
      - name: Qualify Linux production custody boundary using synthetic test keys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          cargo test --locked --release --test production_boundary -- --ignored

  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native PowerShell and BAT startup contracts
        shell: powershell
        run: .\tests\windows\launcher-smoke.ps1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Verify Windows temporary files, child readback and cleanup
        run: uv run --locked --extra security --extra semantics python -m pytest -q tests/unit/test_temporary.py tests/unit/test_pytest_temp_isolation.py tests/unit/test_check_runner.py tests/unit/test_syn_export.py tests/unit/test_identity_cli.py tests/unit/test_artifact_ranges.py tests/unit/test_artifact_uploads.py tests/unit/test_tool_programme.py

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Disposable fixture credentials; never a production connection string.
      POTBOT_TEST_DSN: postgresql://potbot_test:potbot_test_only@127.0.0.1:55432/potbot_test
      UV_PYTHON: "3.12"
      POTBOT_DEBUGGER_EVIDENCE_DIR: artifacts/debugger-cogs
      POTBOT_INVENTORY_EVIDENCE_DIR: artifacts/tool-inventory
      POTBOT_CONTRACT_EVIDENCE_DIR: artifacts/tool-contracts
      POTBOT_PROVENANCE_EVIDENCE_DIR: artifacts/execution-provenance
      POTBOT_RANGE_EVIDENCE_DIR: artifacts/artifact-ranges
      POTBOT_UPLOAD_EVIDENCE_DIR: artifacts/artifact-uploads
      POTBOT_TRANSPORT_EVIDENCE_DIR: artifacts/transport-cogs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked application and development dependencies
        run: uv sync --locked --extra postgres --extra semantics --extra credentials --extra providers --extra web --extra security --extra debugger --dev
      - name: Verify tool-plan parity, dependencies and requirement coverage
        run: uv run --locked python scripts/check_tool_plan.py
      - name: Verify per-object memory plan and acceptance coverage
        run: uv run --locked python scripts/check_memory_graph_plan.py
      - name: Install required Linux process isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2 apparmor-profiles
      - name: Load Ubuntu's Bubblewrap user-namespace profile
        shell: bash
        run: |
          # Ubuntu 24.04 can permit userns creation but deny the setup
          # capabilities Bubblewrap needs for its private loopback interface.
          # Use the distribution profile: its child profile denies capabilities.
          # Keep the host-wide userns restriction and Potbot's seccomp policy.
          potbot_userns_restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$potbot_userns_restriction" ]] && [[ "$(cat "$potbot_userns_restriction")" == 1 ]]; then
            potbot_bwrap_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -r "$potbot_bwrap_profile"
            sudo apparmor_parser --replace "$potbot_bwrap_profile"
          fi
      - name: Verify sandbox setup before database tests
        run: uv run --locked python -m pytest -q tests/integration/test_process_isolation.py
      - name: Start real PostgreSQL with pgvector
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Verify bounded artifact Cogs independently on real PostgreSQL
        run: uv run --locked python -m pytest -q tests/integration/test_artifact_range_cogs.py
      - name: Verify resumable upload Cogs independently on real PostgreSQL
        run: uv run --locked python -m pytest -q tests/integration/test_artifact_upload_cogs.py
      - name: Verify admitted transport Cogs with real services and Linux confinement
        run: uv run --locked python -m pytest -q tests/integration/test_transport_cogs.py
      - name: Verify application, repositories, migrations, and database isolation
        run: uv run --locked python scripts/check.py --with-postgres --with-sandbox
      - name: Verify source-preview release packaging and clean wheel install
        shell: bash
        run: |
          potbot_release_tag="v$(uv run --locked python -c 'import potbot; print(potbot.__version__)')"
          uv run --locked python scripts/build_release.py --tag "$potbot_release_tag" --output artifacts/release-packages
      - name: Verify T01.1 exact-source inventory acceptance
        run: uv run --locked python scripts/check_tool_inventory.py artifacts/tool-inventory/tool-inventory.json --output artifacts/tool-inventory/T01.1-gate.json
      - name: Verify T01.2 exact-source semantic contract acceptance
        run: uv run --locked python scripts/check_semantic_tool_contracts.py artifacts/tool-contracts/semantic-contracts.json --output artifacts/tool-contracts/T01.2-gate.json
      - name: Verify T01.3 exact-source core execution provenance
        run: uv run --locked python scripts/check_execution_provenance.py artifacts/execution-provenance/execution-provenance.json --output artifacts/execution-provenance/T01.3-core-gate.json
      - name: Verify T01.3 exact-source bounded artifact reads
        run: uv run --locked python scripts/check_artifact_ranges.py artifacts/artifact-ranges/artifact-ranges.json --output artifacts/artifact-ranges/T01.3-range-gate.json
      - name: Verify T01.3 exact-source resumable artifact uploads
        run: uv run --locked python scripts/check_artifact_uploads.py artifacts/artifact-uploads/artifact-uploads.json --output artifacts/artifact-uploads/T01.3-upload-gate.json
      - name: Verify implemented tool profiles and report all 48 programme stages
        run: uv run --locked python scripts/check_transport_cogs.py artifacts/transport-cogs/transport-cogs.json --output artifacts/transport-cogs/transport-gate.json
      - name: Evaluate all 48 stages without promoting passing subsets
        run: uv run --locked python scripts/tool_programme_gate.py --artifacts artifacts --output artifacts/tool-programme/report.json
      - name: Retain stage matrix and mandatory suite receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-programme-evidence
          path: |
            artifacts/tool-programme/
            artifacts/transport-cogs/
            artifacts/summary.json
            artifacts/unit-and-git.xml
            artifacts/postgres.xml
            artifacts/sandbox.xml
          if-no-files-found: error
          retention-days: 14
      - name: Retain resumable upload Cog acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-upload-cog-evidence
          path: artifacts/artifact-uploads/
          if-no-files-found: error
          retention-days: 14
      - name: Retain bounded artifact Cog acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-range-cog-evidence
          path: artifacts/artifact-ranges/
          if-no-files-found: error
          retention-days: 14
      - name: Retain execution provenance Cog acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-provenance-cog-evidence
          path: artifacts/execution-provenance/
          if-no-files-found: error
          retention-days: 14
      - name: Capture sanitized provenance diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose logs --no-color postgres 2>&1 | uv run --locked python -c 'import sys; from pathlib import Path; from potbot.evaluation.diagnostics import sanitize_text; Path("artifacts/postgres-service.log").write_text(sanitize_text(sys.stdin.read()), encoding="utf-8")'
      - name: Remove disposable database service and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 10
      - name: Retain authored Python Cog end-to-end evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-debugger-cog-evidence
          path: artifacts/debugger-cogs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potbot-failure-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain source-inventory Cog acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool-inventory-cog-evidence
          path: artifacts/tool-inventory/
          if-no-files-found: error
          retention-days: 14
      - name: Retain canonical semantic contract Cog acceptance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-tool-contract-cog-evidence
          path: artifacts/tool-contracts/
          if-no-files-found: error
          retention-days: 14
