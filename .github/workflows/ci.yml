name: Potbot verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native/potbot-identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Check native source formatting
        run: cargo fmt --check
      - name: Verify native cryptographic and vault contracts
        run: cargo test --locked --release --lib
      - name: Build protected native executable
        run: cargo build --locked --release
      - name: Qualify Linux production custody boundary using synthetic test keys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo prlimit --pid $$ --memlock=268435456:268435456
          cargo test --locked --release --test production_boundary -- --ignored

  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify native PowerShell and BAT startup contracts
        shell: powershell
        run: .\tests\windows\launcher-smoke.ps1

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Disposable fixture credentials; never a production connection string.
      POTBOT_TEST_DSN: postgresql://potbot_test:potbot_test_only@127.0.0.1:55432/potbot_test
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked application and development dependencies
        run: uv sync --locked --extra postgres --extra semantics --extra credentials --extra providers --extra web --extra security --dev
      - name: Install required Linux process isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2 apparmor-profiles
      - name: Load Ubuntu's Bubblewrap user-namespace profile
        shell: bash
        run: |
          # Ubuntu 24.04 can permit userns creation but deny the setup
          # capabilities Bubblewrap needs for its private loopback interface.
          # Use the distribution profile: its child profile denies capabilities.
          # Keep the host-wide userns restriction and Potbot's seccomp policy.
          potbot_userns_restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$potbot_userns_restriction" ]] && [[ "$(cat "$potbot_userns_restriction")" == 1 ]]; then
            potbot_bwrap_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -r "$potbot_bwrap_profile"
            sudo apparmor_parser --replace "$potbot_bwrap_profile"
          fi
      - name: Verify sandbox setup before database tests
        run: uv run --locked python -m pytest -q tests/integration/test_process_isolation.py
      - name: Start real PostgreSQL with pgvector
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Verify application, repositories, migrations, and database isolation
        run: uv run --locked python scripts/check.py --with-postgres --with-sandbox
      - name: Capture sanitized database diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          docker compose logs --no-color postgres 2>&1 | uv run --locked python -c 'import sys; from pathlib import Path; from potbot.evaluation.diagnostics import sanitize_text; Path("artifacts/postgres-service.log").write_text(sanitize_text(sys.stdin.read()), encoding="utf-8")'
      - name: Remove disposable database service and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 10
      - name: Upload sanitized failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potbot-failure-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
