name: S37 browser Cog source and replay safety

on:
  pull_request:
    paths:
      - 'src/potbot/tools/browser_cog_contracts.py'
      - 'src/potbot/tools/browser_evidence.py'
      - 'src/potbot/tools/xpra_browser_worker.py'
      - 'src/potbot/tools/xpra_browser_control.py'
      - 'src/potbot/tools/xpra_app_sessions.py'
      - 'src/potbot/cogs/browser.py'
      - 'src/potbot/cogs/registry.py'
      - 'src/potbot/controller/browser_cogs.py'
      - 'src/potbot/controller/execution_cogs.py'
      - 'tests/unit/test_browser_cogs_s37.py'
      - '.github/workflows/browser-cogs-s37.yml'
  push:
    branches: [main]
    paths:
      - 'src/potbot/tools/browser_cog_contracts.py'
      - 'src/potbot/tools/browser_evidence.py'
      - 'src/potbot/tools/xpra_browser_worker.py'
      - 'src/potbot/tools/xpra_browser_control.py'
      - 'src/potbot/tools/xpra_app_sessions.py'
      - 'src/potbot/cogs/browser.py'
      - 'src/potbot/cogs/registry.py'
      - 'src/potbot/controller/browser_cogs.py'
      - 'src/potbot/controller/execution_cogs.py'
      - 'tests/unit/test_browser_cogs_s37.py'
      - '.github/workflows/browser-cogs-s37.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install locked test environment
        run: uv sync --locked --extra web --dev
      - name: Browser sealed Cog and uncertain replay gates
        run: >-
          uv run --locked python -m pytest -q
          tests/unit/test_browser_cogs_s37.py
          tests/unit/test_xpra_browser_control.py
          tests/unit/test_xpra_browser_worker.py
          tests/unit/test_xpra_application_sessions.py
          tests/integration/test_xpra_native_bridge.py
      - name: Compile and lint installed browser modules
        run: |
          uv run --locked python -m compileall -q src/potbot
          uv run --locked ruff check \
            src/potbot/tools/browser_cog_contracts.py \
            src/potbot/tools/browser_evidence.py \
            src/potbot/cogs/browser.py \
            src/potbot/controller/browser_cogs.py
