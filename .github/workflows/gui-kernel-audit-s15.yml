name: S15 GUI process-tree and file-access audit
on:
  push:
    paths:
      - 'src/potbot/tools/gui_resource_audit.py'
      - 'src/potbot/tools/xpra_app_sessions.py'
      - 'src/potbot/tools/xpra_seamless.py'
      - 'src/potbot/tools/x11_workspace_server.py'
      - 'src/potbot/tools/xpra_operator_fence_s14.py'
      - 'scripts/qualify_gui_telemetry_s15.py'
      - 'tests/unit/test_gui_resource_audit_s15.py'
      - 'tests/unit/test_gui_agent_attribution_s15.py'
      - 'tests/unit/test_gui_resource_integration_s15.py'
      - 'tests/unit/test_gui_audit_qualification_s15.py'
      - '.github/workflows/gui-kernel-audit-s15.yml'
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --extra web
      - run: uv run --locked --dev python -m pytest -q tests/unit/test_gui_resource_audit_s15.py tests/unit/test_gui_resource_integration_s15.py tests/unit/test_gui_agent_attribution_s15.py tests/unit/test_gui_audit_qualification_s15.py tests/unit/test_xpra_application_sessions.py tests/unit/test_xpra_operator_fence_s14.py
      - run: uv run --locked --dev python -m compileall -q src/potbot/tools/gui_resource_audit.py src/potbot/tools/xpra_app_sessions.py src/potbot/tools/xpra_seamless.py scripts/qualify_gui_telemetry_s15.py
