name: S39 Xpra input fencing and HTTPS broker routes
on:
  push:
    branches: [main]
    paths:
      - 'src/potbot/tools/browser_https_routes.py'
      - 'src/potbot/tools/browser_operator_policy.py'
      - 'src/potbot/tools/xpra_browser_worker.py'
      - 'src/potbot/tools/xpra_app_sessions.py'
      - 'src/potbot/tools/xpra_seamless.py'
      - 'src/potbot/tools/x11_workspace_server.py'
      - 'frontend/**'
      - 'tests/unit/test_browser_s39.py'
      - '.github/workflows/browser-s39.yml'
  pull_request:
    paths:
      - 'src/potbot/tools/browser_https_routes.py'
      - 'src/potbot/tools/browser_operator_policy.py'
      - 'src/potbot/tools/xpra_browser_worker.py'
      - 'src/potbot/tools/xpra_app_sessions.py'
      - 'src/potbot/tools/xpra_seamless.py'
      - 'src/potbot/tools/x11_workspace_server.py'
      - 'frontend/**'
      - 'tests/unit/test_browser_s39.py'
      - '.github/workflows/browser-s39.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install pinned Python environment
        run: uv sync --locked --extra web --dev
      - name: S39 and predecessor contracts
        run: >-
          uv run --locked python -m pytest -q
          tests/unit/test_browser_s39.py
          tests/unit/test_browser_s38.py
          tests/unit/test_browser_cogs_s37.py
          tests/unit/test_xpra_browser_control.py
          tests/unit/test_xpra_browser_worker.py
          tests/unit/test_xpra_application_sessions.py
      - name: Compile backend
        run: uv run --locked python -m compileall -q src/potbot
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck and frontend acceptance
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run typecheck
          npm test
          npm run build
