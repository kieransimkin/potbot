name: Browser rendered worker acceptance

on:
  push:
    branches: [main]
    paths:
      - 'src/potbot/tools/xpra_browser_worker.py'
      - 'src/potbot/tools/browser_https_routes.py'
      - 'src/potbot/tools/browser_cog_contracts.py'
      - 'src/potbot/tools/semantic_contracts.py'
      - 'sandbox/image/Dockerfile'
      - 'tests/browser/**'
      - 'tests/unit/test_browser_worker_hardening.py'
      - 'tests/unit/test_browser_capture_recovery.py'
      - 'tests/unit/test_browser_rendered_gate.py'
      - 'scripts/check_browser_rendered.py'
      - 'scripts/browser_rendered_runtime.py'
      - 'tests/unit/test_browser_rendered_runtime.py'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/browser-rendered-acceptance.yml'
  pull_request:
    paths:
      - 'src/potbot/**'
      - 'sandbox/image/**'
      - 'tests/**'
      - 'scripts/check_browser_rendered.py'
      - 'scripts/browser_rendered_runtime.py'
      - 'tests/unit/test_browser_rendered_runtime.py'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/browser-rendered-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [playwright, patchright, playwright-stealth, patchright-stealth]
    env:
      UV_PYTHON: '3.12'
      POTBOT_RUN_BROWSER_RENDERED: '1'
      POTBOT_BROWSER_TEST_BINARY: engine
      POTBOT_BROWSER_LIVE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install locked application and test dependencies
        run: uv sync --locked --dev
      - name: Install browser packages pinned by the actual sandbox image
        # Only this disposable runner is modified. Production rootfs remains
        # build-time-only Docker Compose + operator-admitted sandbox execution.
        run: |
          .venv/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          from scripts.check_browser_rendered import image_pins
          pins = image_pins(Path.cwd())
          subprocess.run(['uv', 'pip', 'install', '--python', '.venv/bin/python',
                          *[f'{name}=={version}' for name, version in sorted(pins.items())]], check=True)
          PY
      - name: Install selected engine browser and isolated test display
        run: |
          if [[ "$POTBOT_BROWSER_LIVE_PROFILE" == patchright* ]]; then
            .venv/bin/python -m patchright install --with-deps chromium
          else
            .venv/bin/python -m playwright install --with-deps chromium
          fi
          sudo apt-get install --yes xvfb xauth openbox x11-utils
      - name: Run worker security and evidence-gate regression tests
        run: |
          mkdir -p artifacts/browser-rendered
          .venv/bin/python -m pytest -q \
            tests/unit/test_xpra_browser_worker.py \
            tests/unit/test_browser_worker_hardening.py \
            tests/unit/test_browser_capture_recovery.py \
            tests/unit/test_browser_rendered_gate.py \
            tests/unit/test_browser_rendered_runtime.py \
            --junitxml=artifacts/browser-rendered/unit.xml
      - name: Exercise real pixels, accessibility, picker, input and worker pipes
        # Do not use uv run here: re-syncing would remove the separately pinned
        # browser packages. Only trusted synthetic pages are exercised.
        run: |
          xvfb-run -a bash -euo pipefail <<'DISPLAY_TEST'
          # A headed browser needs a managed window to produce initial frames.
          # Own this disposable display only; keep observations free of focus changes.
          openbox --sm-disable > artifacts/browser-rendered/window-manager.log 2>&1 &
          display_manager_pid=$!
          trap 'kill "$display_manager_pid" 2>/dev/null || true; wait "$display_manager_pid" 2>/dev/null || true' EXIT
          display_manager_ready=0
          for attempt in {1..50}; do
            kill -0 "$display_manager_pid"
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id #'; then
              display_manager_ready=1
              break
            fi
            sleep 0.1
          done
          test "$display_manager_ready" = 1
          .venv/bin/python -m pytest -q tests/browser/test_rendered_worker.py \
            -o junit_family=xunit1 --junitxml=artifacts/browser-rendered/rendered.xml
          DISPLAY_TEST
      - name: Require every rendered case and exact image package pins
        run: >-
          .venv/bin/python scripts/check_browser_rendered.py
          artifacts/browser-rendered/rendered.xml --profile "$POTBOT_BROWSER_LIVE_PROFILE"
          --require-image-pins --require-engine-binary --output artifacts/browser-rendered/result.json
      - name: Retain synthetic rendered-worker evidence, not production browser data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-rendered-${{ matrix.profile }}
          path: artifacts/browser-rendered/
          if-no-files-found: warn
          retention-days: 14
